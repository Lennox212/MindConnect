spring.application.name=MindConnect

# SQL configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mindconnectusers}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT configuration
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration=900000
app.jwt-refresh-expiration=604800000

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AWS S3 configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:mindconnect-profile-images-xonnel21}
aws.region=${AWS_REGION:us-east-2}